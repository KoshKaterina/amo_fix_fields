[Service]
User=academy-hook
Group=academy-hook
WorkingDirectory=/opt/academy-dedup-hook
EnvironmentFile=/etc/academy-dedup-hook.env
Environment=ACADEMY_DEDUP_WEBHOOK_STATE=/var/lib/academy-dedup-hook
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/usr/bin/python3 /opt/academy-dedup-hook/webhook_daemon.py
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/academy-dedup-hook
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

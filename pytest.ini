[pytest]
# Запуск тестов интеграции нигде не был зафиксирован: ни таймаутов, ни того, чем гонять.
# Заведено 07.10.2026 вместе с починкой сбора (задачи 10, 10г).

# ⚠️ ЗДЕСЬ ТАЙМАУТЫ ВАЖНЕЕ, ЧЕМ В ПАНЕЛИ, и вот почему.
#
# `timeout` режет ОДИН тест. У нас есть известный вис: `test_lead_distribution.py` встаёт в
# паре с некоторыми файлами, потому что путь к sqlite резолвится на импорте и первый
# импортёр выбирает базу за всю сессию (разбор - knowledge/amo-fix-fields-testy-grabli.md).
#
# `session_timeout` режет прогон ЦЕЛИКОМ, включая СБОР - и это тут не теория: 07.10.2026
# `pytest --collect-only` по всему репозиторию не уложился в 600 секунд и был убит снаружи.
# `timeout` сбор НЕ покрывает, то есть без этой строки CI стоял бы до лимита задачи и в логе
# не было бы ни строчки о причине.
#
# 60 с на тест: тесты интеграции дешёвые, сети в них нет, минута - аварийный предел.
timeout = 60
# ⚠️ timeout_method НЕ закрепляем: на Windows `signal` ломает прогон в
# `INTERNALERROR: module 'signal' has no attribute 'SIGALRM'` ровно когда срабатывает
# session_timeout (проверено 07.10 на панели). Пусть плагин выбирает сам: signal в CI на
# Linux, thread на машинах разработки.
# 15 минут на весь прогон - аварийный потолок, а не норма.
session_timeout = 900
